services:
  db:
    build:
      context: .
      dockerfile: database/Dockerfile

    container_name: ukai_postgres

    environment:
      POSTGRES_DB: ukai
      POSTGRES_USER: ukai
      POSTGRES_PASSWORD: ukai

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukai -d ukai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
