[mypy]
python_version = 3.13
platform = linux
check_untyped_defs = True
follow_imports = silent
show_error_codes = True
warn_unused_ignores = True
no_incremental = True
# Gradual B2 application typing, including bodies of unannotated functions.
# Imported B1/third-party signatures are retained; their implementation errors
# are not reported as B2 errors. No blanket missing-import/error suppression.
